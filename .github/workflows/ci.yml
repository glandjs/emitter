name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.2.23']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'

      - name: Install dependencies
        run: bun install

      - name: Prettier check
        run: bun run format:check

  package:
    name: Verify package contents
    runs-on: ubuntu-latest
    needs: [test, typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Pack
        run: bun run pack

      # dist/ is gitignored, so a stale build would be invisible to CI otherwise.
      - name: Assert dist is not empty
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "dist/ is empty after build"
            exit 1
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: '*.tgz'
          retention-days: 5
