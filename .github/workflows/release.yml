name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Turn the pending changesets into a version bump, a changelog entry and a
  # commit on main. Runs whether or not a release is actually pending, so the
  # changeset queue is drained on every push.
  # ───────────────────────────────────────────────────────────────────────────
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.version.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'

      - name: Install dependencies
        run: bun install

      - name: Create Release Pull Request or apply pending versions
        id: version
        uses: changesets/action@v1
        with:
          commit: 'chore(release): version package'
          title: 'chore(release): version package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # Build, then publish to npm. Gated on the version job actually finding
  # pending changesets so ordinary pushes do not hit the registry.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish
        run: bun run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
